# «قعدة آخر واحد» على Render (Blueprint). الكود بمجلد akher-wahed
services:
  - type: web
    name: qa3da-akher-wahed
    runtime: node
    plan: free
    rootDir: akher-wahed
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_KEY
        generateValue: true
